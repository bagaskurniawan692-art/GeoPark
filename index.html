<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO-Park WebGIS · Satelit & OpenStreetMap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4e9;--card:#fffefa;--ink:#1a3d2e;--mut:#667a6e;--g:#2f6b4a;--o:#f59e0b;--bd:#e3e0d2;--hd:#1a3d2e;--hi:#d6e9a8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f18;--card:#16291f;--ink:#e8f1d8;--mut:#9db3a3;--bd:#27402f;--hd:#0a1812}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo b{font-size:20px;font-weight:800}.logo b i{color:var(--o);font-style:normal}.logo small{display:block;color:var(--hi);font-size:11px}
.parks{display:flex;gap:6px;margin-left:auto}
.parks button{border:1.5px solid #ffffff40;background:transparent;color:#fff;padding:7px 13px;border-radius:99px;font:600 13px inherit;cursor:pointer}
.parks button.on{background:var(--pc);border-color:var(--pc)}
main{flex:1;min-height:0;display:grid;grid-template-columns:370px 1fr}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd)}
.tabs{display:flex;padding:10px 12px 0;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 2px;font:700 13px inherit;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--o)}
.pane{flex:1;overflow:auto;padding:12px}
input[type=search]{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:99px;font:600 12px inherit;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.item{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:5px solid var(--c)}
.em{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:var(--c);flex:none}
.item b{display:block}.item span{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.btn{border:0;background:var(--g);color:#fff;padding:10px 14px;border-radius:11px;font:700 13px inherit;cursor:pointer;margin:4px 4px 0 0}
.btn.o{background:var(--o);color:#2b1b00}.btn.l{background:transparent;color:var(--ink);border:1px solid var(--bd)}.btn:disabled{opacity:.4}
.tag{display:inline-block;background:var(--bd);padding:3px 9px;border-radius:99px;font-size:12px;margin:2px 3px 2px 0}
.mut{color:var(--mut)}
.pts{background:linear-gradient(135deg,#1a3d2e,#2f6b4a);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.pts big{font-size:38px;font-weight:800;color:var(--o);line-height:1}
.bar{height:8px;border-radius:9px;background:#ffffff30;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}
.ms{border-left:5px solid var(--c)}.ms.done{opacity:.6}
#map{height:100%;width:100%;background:#cfe6b8}
.pin{position:relative;width:36px;height:36px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px #0007}
.pin.on{transform:scale(1.3);outline:3px solid var(--o)}
.ck{position:absolute;right:-6px;top:-6px;background:#22a05a;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);background:#1a3d2e;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:9999;max-width:90%;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:46% 1fr}#map{order:-1}aside{border:0}.parks{margin-left:0;width:100%}.parks button{flex:1;padding:7px 4px}}
</style></head><body>
<header><div class="logo"><b>GEO<i>-Park</i></b><small>Jelajah. Temukan. Nikmati.</small></div><div class="parks" id="parks"></div></header>
<main><aside><div class="tabs" id="tabs"></div><div class="pane" id="pane"></div></aside><div id="map"></div></main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const C={sat:['Satwa','🐘','#3f9a63'],edu:['Edukasi','🔬','#3b8f9a'],wah:['Wahana','🎢','#e8a23a'],kul:['Kuliner','🍜','#d9694f'],fas:['Fasilitas','🚻','#6b7fa8'],rwd:['Reward','🎁','#b8429a']};
const PK={1:['Jatim Park 1','#2f6b4a'],2:['Jatim Park 2','#e8821a'],3:['Jatim Park 3','#3b8f9a']};
// pusat taman: JP1 & JP2 dari sumber publik; JP3 dicari otomatis lewat OpenStreetMap (Nominatim). f = pusat Kota Batu (cadangan)
const CT={1:[-7.88412,112.52491],2:[-7.888005,112.529566],3:null,f:[-7.8712,112.5269]};
// posisi awal = perkiraan relatif terhadap pusat taman (x,y skematis). Geser titik di "Mode atur posisi" ke lokasi sebenarnya.
const D=[
[1,'Pintu Masuk JP1','fas',500,590,'Gerbang utama, loket, dan pusat informasi.','Tiket · Informasi · Toilet'],
[1,'Volcano & Galeri Nusantara','edu',300,200,'Area edukasi gunung berapi, tanaman agro, diorama satwa langka, dan miniatur candi.','Ramah anak · Ramah rombongan sekolah'],
[1,'Spinning Coaster','wah',720,180,'Wahana ekstrem untuk pengunjung yang suka tantangan.','Batas tinggi berlaku · Area tunggu'],
[1,'Kolam Renang Raksasa','wah',760,380,'Kolam besar dengan latar patung Ken Dedes, Ken Arok, dan Mpu Gandring.','Loker · Ruang bilas'],
[1,'Museum Tubuh Bagong Adventure','edu',200,350,'Museum tubuh manusia interaktif untuk belajar sains.','Jalur ramah kursi roda'],
[1,'Food Court','kul',520,400,'Pilihan makanan dan minuman untuk rombongan.','Area makan luas · Mushola dekat'],
[1,'Toilet & Mushola','fas',330,450,'Fasilitas ibadah dan sanitasi.','Toilet · Mushola · Ruang menyusui'],
[1,'Reward Center JP1','rwd',480,510,'Tukarkan poin GEO-Quest dengan merchandise.','Petugas verifikasi · Katalog hadiah'],
[2,'Pintu Masuk JP2','fas',520,595,'Gerbang utama, loket, dan informasi.','Tiket · Informasi · Parkir'],
[2,'Batu Secret Zoo','sat',250,200,'Kebun binatang dengan beragam satwa untuk diamati.','Jalur ramah kursi roda · Toilet'],
[2,'Museum Satwa','edu',520,150,'Koleksi edukasi tentang satwa dan habitatnya.','AC · Panel edukasi'],
[2,'River Adventure','wah',780,240,'Wahana petualangan air di Jatim Park 2.','Batas tinggi berlaku · Loker'],
[2,'Reptile Garden','sat',300,410,'Zona reptil di Batu Secret Zoo, diamati dari area pengunjung.','Papan informasi · Area duduk'],
[2,'Resto Savana','kul',560,380,'Restoran bertema savana.','Menu keluarga · Area makan'],
[2,'Toilet Tengah','fas',720,470,'Toilet dan ruang istirahat.','Toilet · Ruang menyusui'],
[2,'Reward Center JP2','rwd',480,530,'Penukaran poin dan merchandise.','Petugas verifikasi'],
[3,'Pintu Masuk JP3','fas',500,595,'Gerbang utama dan pusat informasi.','Tiket · Informasi · Parkir'],
[3,'Dino Park','edu',260,210,'Replika dinosaurus dan edukasi purba.','Spot foto · Papan edukasi'],
[3,'The Legend Stars','wah',740,200,'Taman wahana tematik di Jatim Park 3.','Batas tinggi berlaku'],
[3,'Fun Tech Plaza','edu',500,150,'Area bermain sains dan teknologi untuk anak.','Jalur teduh · Area belajar'],
[3,'Ice Age Park','sat',320,420,'Miniatur ekosistem zaman es, diamati dari area pengunjung.','Ramah anak · Papan edukasi'],
[3,'Food Court JP3','kul',600,400,'Kuliner dan jajanan khas.','Area makan luas'],
[3,'Toilet & Mushola JP3','fas',740,470,'Fasilitas ibadah dan sanitasi.','Toilet · Mushola'],
[3,'Reward Center JP3','rwd',480,515,'Penukaran poin dan merchandise.','Petugas verifikasi']];
const Q={sat:['Dari mana pengunjung boleh mengamati satwa di GEO-Park?',['Dari area pengunjung','Dengan masuk ke kandang','Sambil memberi makan satwa']],
edu:['GEO-Park termasuk jenis aplikasi apa?',['WebGIS: peta interaktif berbasis web','Aplikasi kasir offline','Game konsol']],
con:['Sikap yang benar terhadap satwa di taman?',['Tidak menyentuh dan tidak memberi makan','Mengajak satwa berfoto dari dekat','Memakai lampu kilat ke arah satwa']]};
const PT={sat:50,edu:30},RW=[[100,'Stiker GEO-Park','🏷️'],[200,'Gantungan kunci','🔑'],[350,'Pin eksklusif','📍'],[500,'Tote bag','👜'],[750,'Merchandise spesial','🎁']];
let S={pts:0,sc:[],adv:0,con:0,red:[]},G={};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('gp')||'{}'));G=JSON.parse(localStorage.getItem('gpo')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('gp',JSON.stringify(S));localStorage.setItem('gpo',JSON.stringify(G))}catch(e){}};
let park=1,cat=null,q='',sel=null,tab='x',me=null,edit=false,rt=null,placing=false;
const $=id=>document.getElementById(id),idx=()=>D.map((d,i)=>i).filter(i=>D[i][0]==park),EN=()=>idx().find(i=>D[i][1].startsWith('Pintu'));
const fm=m=>m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';
function pos(i){if(G[i])return G[i];const d=D[i],c=CT[d[0]]||CT.f;return[c[0]-(d[4]-320)*.5/111320,c[1]+(d[3]-500)*.5/(111320*Math.cos(c[0]*Math.PI/180))]}
function toast(t){const e=$('toast');e.textContent=t;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
// ===== peta =====
const map=L.map('map').setView(CT[1],17);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Citra © Esri, Maxar, Earthstar Geographics'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
sat.addTo(map);L.control.layers({'🛰️ Satelit':sat,'🗺️ OpenStreetMap':osm}).addTo(map);
const lg=L.layerGroup().addTo(map);
map.on('click',e=>{if(placing){me=[e.latlng.lat,e.latlng.lng];placing=false;all()}});
function mk(){lg.clearLayers();
idx().forEach(i=>{const d=D[i],c=C[d[2]];if(cat&&d[2]!=cat)return;if(q&&!d[1].toLowerCase().includes(q))return;
const m=L.marker(pos(i),{draggable:edit,icon:L.divIcon({className:'',iconSize:[36,36],iconAnchor:[18,18],html:`<div class="pin${sel==i?' on':''}" style="background:${c[2]}">${c[1]}${S.sc.includes(i)?'<b class="ck">✓</b>':''}</div>`})}).addTo(lg).bindTooltip(d[1],{direction:'top',offset:[0,-18]});
m.on('click',()=>pick(i,0));
m.on('dragend',e=>{const p=e.target.getLatLng();G[i]=[+p.lat.toFixed(6),+p.lng.toFixed(6)];sv();toast('Posisi '+d[1]+' disimpan')})});
if(me)L.circleMarker(me,{radius:9,color:'#fff',weight:3,fillColor:'#2b7de9',fillOpacity:1}).addTo(lg).bindTooltip('Lokasi Anda');
if(rt)L.polyline(rt.pts,{color:'#2b7de9',weight:6,opacity:.9,dashArray:rt.dash?'2 10':null}).addTo(lg)}
async function geo(p){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent('Jatim Park '+p+' Batu'));const j=await r.json();if(!j[0])throw 0;CT[p]=[+j[0].lat,+j[0].lon]}catch(e){CT[p]=CT.f;toast('Koordinat taman tidak ditemukan otomatis · geser titik secara manual')}mk();map.flyTo(CT[p],17)}
function goPark(p){park=p;sel=null;rt=null;cat=null;q='';all();if(CT[p])map.flyTo(CT[p],17);else{map.flyTo(CT.f,15);geo(p)}}
function nearest(){return me?idx().map(i=>[i,map.distance(me,pos(i))]).sort((a,b)=>a[1]-b[1]).slice(0,3):[]}
async function route(i){const a=me||pos(EN()),b=pos(i);rt={pts:[a,b],dash:1,m:map.distance(a,b),to:i};
try{const r=await fetch(`https://router.project-osrm.org/route/v1/foot/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`),x=(await r.json()).routes[0];rt={pts:x.geometry.coordinates.map(c=>[c[1],c[0]]),dash:0,m:x.distance,to:i}}catch(e){}
map.fitBounds(L.latLngBounds(rt.pts),{padding:[60,60],maxZoom:19});all()}
// ===== panel =====
function parks(){$('parks').innerHTML=Object.keys(PK).map(k=>`<button class="${k==park?'on':''}" style="--pc:${PK[k][1]}" data-p="${k}">${PK[k][0]}</button>`).join('')}
function tabs(){$('tabs').innerHTML=[['x','🗺️ Jelajah'],['q','🏆 Quest'],['r','🎁 Reward']].map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}
function explore(){if(sel!=null&&D[sel][0]==park)return detail(sel);const nr=nearest();
let h=`<div class="card"><b>${PK[park][0]}</b><br><button class="btn o" data-loc="1">📍 Lokasi saya</button><button class="btn ${edit?'o':'l'}" data-edit="1">✏️ Atur posisi titik: ${edit?'ON':'OFF'}</button>${edit?`<button class="btn l" data-exp="1">Salin koordinat</button><p class="mut" style="font-size:12px">Seret ikon ke lokasi sebenarnya di citra satelit; posisi tersimpan otomatis.</p>`:''}</div>
<input type="search" id="q" placeholder="Cari wahana, fasilitas, atau lokasi…" value="${q}"><div class="chips"><button class="chip ${cat?'':'on'}" data-c="">Semua</button>${Object.keys(C).map(k=>`<button class="chip ${cat==k?'on':''}" data-c="${k}">${C[k][1]} ${C[k][0]}</button>`).join('')}</div>`;
if(nr.length)h+=`<div class="card"><b>📍 Wahana terdekat dari Anda</b><br>${nr.map(n=>`<span class="tag">${D[n[0]][1]} · ${fm(n[1])}</span>`).join('')}</div>`;
h+=idx().filter(i=>(!cat||D[i][2]==cat)&&(!q||D[i][1].toLowerCase().includes(q))).map(i=>{const d=D[i],c=C[d[2]];return`<div class="item" style="--c:${c[2]}" data-i="${i}"><div class="em">${c[1]}</div><div><b>${d[1]}</b><span>${c[0]} · ${d[6].split(' · ')[0]}</span></div></div>`}).join('');
return h+`<p class="mut" style="font-size:11px">Posisi awal titik adalah perkiraan; koreksi lewat mode atur posisi. Peta: © OpenStreetMap contributors, citra © Esri.</p>`}
function detail(i,qz){const d=D[i],c=C[d[2]],p=pos(i),can=PT[d[2]],done=S.sc.includes(i);
let h=`<button class="btn l" data-back="1">← Kembali</button><div class="card" style="border-top:5px solid ${c[2]}"><div style="font-size:34px">${c[1]}</div><h2 style="margin:4px 0">${d[1]}</h2><span class="tag" style="background:${c[2]};color:#fff">${c[0]}</span><span class="tag">${PK[d[0]][0]}</span><p>${d[5]}</p><b>GEO-Info · Fasilitas</b><br>${d[6].split(' · ').map(f=>`<span class="tag">✔ ${f}</span>`).join('')}<p>📍 <b>${p[0].toFixed(6)}, ${p[1].toFixed(6)}</b>${G[i]?' <span class="tag">posisi dikoreksi</span>':''}</p>`;
if(me)h+=`<p>📏 Jarak dari Anda: <b>${fm(map.distance(me,p))}</b></p>`;
h+=`<button class="btn" data-route="${i}">🧭 Rute jalan kaki</button>`;
if(rt&&rt.to==i)h+=`<p>🧭 <b>${fm(rt.m)}</b> · sekitar ${Math.max(1,Math.round(rt.m/80))} menit jalan kaki ${rt.dash?'<span class="tag">garis lurus</span>':''}<button class="btn l" data-route="-1">✖ Hapus</button></p>`;
if(qz)h+=`<div class="card" style="background:var(--bg)"><b>${Q[qz][0]}</b>${Q[qz][1].map((o,k)=>`<button class="btn l" style="display:block;width:100%;text-align:left" data-a="${k}" data-q="${qz}" data-i="${i}">${o}</button>`).join('')}</div>`;
else if(can)h+=done?`<p>✅ Misi titik ini selesai.</p>`:`<button class="btn o" data-scan="${i}">📷 Scan QR &amp; jawab kuis (+${can} poin)</button>`;
return h+`</div>`}
function quest(){const n=k=>S.sc.filter(i=>D[i][2]==k).length,t=k=>D.filter(d=>d[2]==k).length,nx=RW.find(r=>r[0]>S.pts);
const M=[['WILDLIFE EXPLORER · +50 PTS','Scan QR di area satwa lalu jawab kuis.',n('sat')+'/'+t('sat'),'#3f9a63',n('sat')==t('sat')],['SCIENCE HUNTER · +30 PTS','Kuis singkat di wahana edukasi.',n('edu')+'/'+t('edu'),'#3b8f9a',n('edu')==t('edu')],['ADVENTURE SEEKER · +100 PTS','Kunjungi 5 titik berbeda.',Math.min(5,S.sc.length)+'/5','#e8a23a',S.adv],['CONSERVATION HERO · +75 PTS','Tantangan edukasi konservasi.',S.con?'1/1':'0/1','#d9694f',S.con]];
return`<div class="pts"><span style="opacity:.8">Poin kamu</span><br><big>${S.pts}</big> <b>PTS</b><div class="bar"><i style="width:${Math.min(100,S.pts/7.5)}%"></i></div><small>${nx?`${nx[0]-S.pts} poin lagi untuk ${nx[1]}`:'Semua hadiah terbuka! 🎉'}</small></div>`+M.map(m=>`<div class="card ms ${m[4]?'done':''}" style="--c:${m[3]}"><b>${m[0]}</b><br><span class="mut">${m[1]}</span><br><b>${m[4]?'✅ Selesai':'Progres '+m[2]}</b></div>`).join('')+`<button class="btn o" data-con="1" ${S.con?'disabled':''}>🌿 Kuis Konservasi (+75)</button><button class="btn l" data-reset="1">Reset progres</button><p class="mut" style="font-size:11px">Satwa hanya diamati dari area pengunjung. Satu titik hanya bisa diklaim sekali.</p>`}
function rewards(){return`<div class="pts"><span style="opacity:.8">Reward Center</span><br><big>${S.pts}</big> <b>PTS</b></div>`+RW.map((r,k)=>`<div class="item" style="--c:#f59e0b;cursor:default"><div class="em">${r[2]}</div><div style="flex:1"><b>${r[1]}</b><span>${r[0]} poin</span></div><button class="btn" data-rd="${k}" ${S.pts<r[0]?'disabled':''}>Tukar</button></div>`).join('')+(S.red.length?`<div class="card"><b>Riwayat penukaran</b><br>${S.red.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:'')}
function pane(){const p=$('pane'),sc=p.scrollTop;p.innerHTML=tab=='x'?explore():tab=='q'?quest():rewards();p.scrollTop=sc;
const qi=$('q');if(qi)qi.oninput=()=>{q=qi.value.trim().toLowerCase();pane();mk();const e=$('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
function all(){parks();tabs();pane();mk()}
function pick(i,fl){sel=i;tab='x';if(fl)map.flyTo(pos(i),19);all()}
function award(i){const p=PT[D[i][2]];S.sc.push(i);S.pts+=p;let m=`+${p} poin! 🎉`;if(S.sc.length>=5&&!S.adv){S.adv=1;S.pts+=100;m+=' Bonus Adventure Seeker +100!'}sv();toast(m)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-p],[data-t],[data-c],.item[data-i],[data-back],[data-scan],[data-a],[data-con],[data-rd],[data-reset],[data-route],[data-loc],[data-edit],[data-exp]');if(!t)return;const x=t.dataset;
if(x.p)goPark(+x.p);
else if(x.t){tab=x.t;pane();tabs()}
else if(x.c!==undefined&&t.classList.contains('chip')){cat=x.c||null;pane();mk()}
else if(t.classList.contains('item')&&x.i!==undefined)pick(+x.i,1);
else if(x.back){sel=null;all()}
else if(x.scan){const i=+x.scan;$('pane').innerHTML=detail(i,D[i][2]=='sat'?'sat':'edu')}
else if(x.a!==undefined){if(+x.a===0){const i=+x.i;if(x.q=='con'){S.con=1;S.pts+=75;sv();toast('+75 poin! Conservation Hero 🌿');tab='q'}else award(i);all()}else toast('Belum tepat, coba lagi 🙂')}
else if(x.con){$('pane').innerHTML=`<button class="btn l" data-t="q">← Kembali</button><div class="card"><b>${Q.con[0]}</b>${Q.con[1].map((o,k)=>`<button class="btn l" style="display:block;width:100%;text-align:left" data-a="${k}" data-q="con" data-i="0">${o}</button>`).join('')}</div>`}
else if(x.rd){const r=RW[+x.rd];if(S.pts>=r[0]){S.pts-=r[0];const c='GP-'+Math.random().toString(36).slice(2,6).toUpperCase();S.red.push(r[1]+' · '+c);sv();toast('Kode penukaran: '+c);pane()}}
else if(x.reset){S={pts:0,sc:[],adv:0,con:0,red:[]};sv();all()}
else if(x.route){const i=+x.route;if(i<0){rt=null;all()}else route(i)}
else if(x.loc){const f=()=>{placing=true;toast('GPS tidak tersedia · klik peta untuk menandai posisi Anda')};navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.latitude,p.coords.longitude];map.flyTo(me,18);all()},f,{timeout:8000}):f()}
else if(x.edit){edit=!edit;all()}
else if(x.exp){const s=idx().map(i=>D[i][1]+' | '+pos(i).map(v=>v.toFixed(6)).join(', ')).join('\n');try{navigator.clipboard.writeText(s).then(()=>toast('Koordinat disalin'),()=>prompt('Salin koordinat:',s))}catch(er){prompt('Salin koordinat:',s)}}});
addEventListener('resize',()=>map.invalidateSize());all();
</script></body></html>
