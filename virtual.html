.mk{cursor:pointer}.lb{font:700 11px 'Plus Jakarta Sans',sans-serif;fill:#173326;paint-order:stroke;stroke:#fffdf0;stroke-width:3.5px;text-anchor:middle}

@keyframes pu{0%{r:14;opacity:.7}100%{r:34;opacity:0}}.pl{animation:pu 1.6s infinite}.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}

for(let i=0;i<70;i++){const x=90+r()*820|0,y=50+r()*570|0;s+=`<path d="M${x} ${y-12}l9 20h-18z" fill="#2f6b4a" opacity="${.5+r()*.4}"/>`}
s+=`<text x="84" y="100" font-size="46" font-weight="800" fill="#fffefa" opacity=".92">${PK[park][0]}</text><text x="86" y="126" font-size="16" fill="#d6e9a8">Jelajah. Temukan. Nikmati.</text>`;
idx().forEach(i=>{const d=D[i],c=C[d[2]];if(i==en)return;s+=`<g transform="translate(${d[3]} ${d[4]-46})" pointer-events="none"><g class="fl"><ellipse cy="36" rx="22" ry="6" fill="#0004"/><circle r="30" fill="#fffefa" stroke="${c[2]}" stroke-width="4"/><text y="13" text-anchor="middle" font-size="34">${EMJ(d[1],d[2])}</text></g></g>`});
s+=`<g transform="translate(${D[en][3]} ${D[en][4]-40})" pointer-events="none"><circle r="28" fill="#fffefa" stroke="#d9a23a" stroke-width="4"/><text y="12" text-anchor="middle" font-size="32">🎪</text></g>`;
return s+cloud(120,70,1.3,'#fffefa')+cloud(880,110,1.1,'#f6c9d0')+cloud(150,610,1.2,'#f6c9d0')+cloud(910,600,1,'#fffefa')}
function scene(r,en){if(sty==2)return game(r,en);const p=PAL[sty];let s=`<rect x="-2500" y="665" width="6000" height="120" fill="${p.rd}"/><rect x="-2500" y="722" width="6000" height="4" fill="#f5d44b" opacity=".8"/><text x="140" y="700" font-size="17" font-weight="700" fill="#fff" opacity=".95">${RN[park]}</text>`;
s+=`<rect x="40" y="30" width="920" height="610" rx="40" fill="${p.zn}" opacity=".55" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>`;
s+=`<rect x="330" y="620" width="340" height="38" rx="6" fill="${p.rd}"/>`+[...Array(14)].map((_,k)=>`<rect x="${342+k*23}" y="626" width="2" height="26" fill="#fff" opacity=".7"/>`).join('');
s+=`<ellipse cx="${400+park*60}" cy="300" rx="120" ry="55" fill="${p.lk}" stroke="#fff" stroke-width="5" opacity=".9"/>`;
for(let i=0;i<110;i++){const x=r()*1000,y=r()*640;s+=`<circle cx="${x|0}" cy="${y|0}" r="${7+r()*10|0}" fill="${p.tr}" opacity="${.35+r()*.3}"/>`}
idx().forEach(i=>{const d=D[i],c=C[d[2]];if(i==en)return;const w=74+(i*37%40),h=46+(i*23%28),x=d[3]-w/2,y=d[4]-h/2;s+=`<rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+12}" rx="18" fill="${c[2]}" opacity=".3"/><rect x="${x+5}" y="${y+7}" width="${w}" height="${h}" rx="8" fill="#000" opacity=".2"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${p.bd}" stroke="${p.bs}" stroke-width="2"/><rect x="${x+6}" y="${y+6}" width="${w-12}" height="8" rx="3" fill="${c[2]}" opacity=".85"/>`});
s+=`<rect x="${D[en][3]-42}" y="${D[en][4]-14}" width="84" height="28" rx="6" fill="${p.bd}" stroke="#d9a23a" stroke-width="3"/>`;return s}
function draw(){
const r=rnd(park*97+13),en=idx().find(i=>D[i][1].startsWith('Pintu')),[ex,ey]=[D[en][3],D[en][4]],pc=PK[park][1];
let s=`<defs><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="${PAL[sty].bg0}"/><stop offset="1" stop-color="${PAL[sty].bg1}"/></radialGradient></defs><rect x="-2500" y="-2500" width="6000" height="6000" fill="url(#bg)"/>`;
s+=scene(r,en);

idx().forEach(i=>{const d=D[i];if(i==en)return;s+=`<path d="M${ex} ${ey}Q${(ex+d[3])/2+30} ${(ey+d[4])/2-30} ${d[3]} ${d[4]}" fill="none" stroke="#f1e6bf" stroke-width="12" stroke-linecap="round"/><path d="M${ex} ${ey}Q${(ex+d[3])/2+30} ${(ey+d[4])/2-30} ${d[3]} ${d[4]}" fill="none" stroke="#d9c58c" stroke-width="2" stroke-dasharray="4 8"/>`});
if(heat)idx().forEach(i=>{s+=`<circle cx="${D[i][3]}" cy="${D[i][4]}" r="${20+pop(i)/3.2}" fill="#ff4d1a" opacity=".28"/>`});if(rt){const ri=routeInfo();s+=`<path d="${ri.d}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="${ri.d}" fill="none" stroke="#2b7de9" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 12"/>`}const nr=nearest();if(me&&nr[0]){const d=D[nr[0][0]];s+=`<line x1="${me[0]}" y1="${me[1]}" x2="${d[3]}" y2="${d[4]}" stroke="#2b7de9" stroke-width="4" stroke-dasharray="9 8"/>`}
idx().forEach(i=>{const d=D[i],c=C[d[2]];if(cat&&d[2]!=cat)return;if(q&&!d[1].toLowerCase().includes(q))return;const on=sel==i;
s+=`<g class="mk" data-i="${i}" transform="translate(${d[3]},${d[4]})">${on||sty==2&&!S.sc.includes(i)?`<circle class="pl" r="14" fill="${c[2]}"/>`:''}<circle r="${on?22:17}" fill="${c[2]}" stroke="#fff" stroke-width="3.5"/><text y="${on?8:6}" text-anchor="middle" font-size="${on?22:17}">${c[1]}</text>${S.sc.includes(i)?'<circle cx="13" cy="-13" r="8" fill="#22a05a" stroke="#fff" stroke-width="2"/><text x="13" y="-9" text-anchor="middle" font-size="11" fill="#fff" font-weight="800">✓</text>':''}<text class="lb" y="${on?40:33}">${d[1]}</text></g>`});
if(sty==2){const a=me||P(EN());s+=`<g transform="translate(${a[0]},${a[1]})" pointer-events="none"><ellipse cy="18" rx="18" ry="7" fill="#0006"/><circle class="pl" r="14" fill="#2b7de9"/><text y="12" text-anchor="middle" font-size="34">🧑‍🎒</text></g>`}else if(me)s+=`<g transform="translate(${me[0]},${me[1]})"><circle class="pl" r="14" fill="#2b7de9"/><circle r="9" fill="#2b7de9" stroke="#fff" stroke-width="3.5"/></g>`;
svg.innerHTML=s}
function fly(i){const d=D[i];if(vb.w>620)zoom(620/vb.w);vb.x=d[3]-vb.w/2;vb.y=d[4]-vb.h/2;ap()}
function sel_(i,f){sel=i;tab='x';f&&fly(i);all()}
function parks(){$('parks').innerHTML=Object.keys(PK).map(k=>`<button class="${k==park?'on':''}" style="--pc:${PK[k][1]}" data-p="${k}">${PK[k][0]}</button>`).join('');
$('lg').innerHTML=Object.keys(C).map(k=>`<span>${C[k][1]} ${C[k][0]}</span>`).join('')}
function tabs(){$('tabs').innerHTML=[['x','🗺️ Jelajah'],['q','🏆 Quest'],['r','🎁 Reward'],['d','📊 Insight']].map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}
function explore(){
if(sel!=null&&D[sel][0]==park)return detail(sel);
const nr=nearest();
let h=parkInfo()+`<input type="search" id="q" placeholder="Cari wahana, fasilitas, atau lokasi…" value="${q}"><div class="chips"><button class="chip ${cat?'':'on'}" data-c="">Semua</button>${Object.keys(C).map(k=>`<button class="chip ${cat==k?'on':''}" data-c="${k}">${C[k][1]} ${C[k][0]}</button>`).join('')}</div>`;
if(nr.length)h+=`<div class="card"><b>📍 Wahana terdekat dari Anda</b><br>${nr.map(n=>`<span class="tag">${D[n[0]][1]} · ±${n[1]} m</span>`).join('')}</div>`;
const L=idx().filter(i=>(!cat||D[i][2]==cat)&&(!q||D[i][1].toLowerCase().includes(q)));
h+=L.map(i=>{const d=D[i],c=C[d[2]];return`<div class="item" style="--c:${c[2]}" data-i="${i}"><div class="em">${c[1]}</div><div><b>${d[1]}</b><span>${c[0]} · ${d[6].split(' · ')[0]}</span></div></div>`}).join('')||'<p class="mut">Tidak ada titik yang cocok.</p>';
return h+`<p class="mut" style="font-size:11px">Nama wahana mengacu pada sumber publik; posisi titik di peta masih skematis, belum hasil survei lapangan.</p>`}
function detail(i,qz){const d=D[i],c=C[d[2]],can=PT[d[2]],done=S.sc.includes(i);
const sc=('🌲🌿'+c[1]+'🌳⛰️☁️🌲').repeat(4);
let h=`<button class="btn l" data-back="1">← Kembali</button><div class="card" style="border-top:5px solid ${c[2]}"><div style="font-size:34px">${c[1]}</div><h2 style="margin:4px 0">${d[1]}</h2><span class="tag" style="background:${c[2]};color:#fff">${c[0]}</span><span class="tag">${PK[d[0]][0]}</span><p>${d[5]}</p><b>GEO-Info · Fasilitas</b><br>${d[6].split(' · ').map(f=>`<span class="tag">✔ ${f}</span>`).join('')}
<div style="margin-top:10px"><b>GEO-Virtual · Tur 360°</b> <span class="mut">(simulasi)</span><div class="pano"><div id="pn">${sc}</div></div><input type="range" id="rg" min="0" max="100" value="0"></div>`;
if(me)h+=`<p>📏 Jarak dari lokasi Anda: <b>±${dist(me,[d[3],d[4]])} m</b></p>`;
if(qz)h+=`<div class="card" style="background:var(--bg)"><b>${Q[qz][0]}</b>${Q[qz][1].map((o,k)=>`<button class="btn l" style="display:block;width:100%;text-align:left" data-a="${k}" data-q="${qz}" data-i="${i}">${o}</button>`).join('')}</div>`;
else if(can)h+=done?`<p>✅ Misi titik ini selesai.</p>`:`<button class="btn o" data-scan="${i}">📷 Scan QR &amp; jawab kuis (+${can} poin)</button>`;
else h+=`<p class="mut">Titik ini tidak memiliki misi.</p>`;
if(G[i])h+=`<p>📍 <b>${G[i][0]}, ${G[i][1]}</b> <span class="tag">koordinat nyata</span></p>`;if(routeStart(i)!=null)h+=`<button class="btn" data-route="${i}">🧭 Rute ke sini</button>`;if(rt&&rt[1]==i){const ri=routeInfo();h+=`<p>🧭 <b>${me?'Lokasi Anda → ':''}${D[rt[0]][1]} → ${d[1]}</b><br>±${ri.m} m · sekitar ${Math.max(1,Math.round(ri.m/80))} menit jalan kaki <button class="btn l" data-route="-1">✖ Hapus rute</button></p>`}
return h+`</div>`}
function quest(){const n=k=>S.sc.filter(i=>D[i][2]==k).length,t=k=>D.filter(d=>d[2]==k).length,nx=RW.find(r=>r[0]>S.pts);
const M=[['WILDLIFE EXPLORER · +50 PTS','Scan QR di area satwa lalu jawab kuis.',n('sat')+'/'+t('sat'),'#3f9a63',n('sat')==t('sat')],['SCIENCE HUNTER · +30 PTS','Kuis singkat di wahana edukasi.',n('edu')+'/'+t('edu'),'#3b8f9a',n('edu')==t('edu')],['ADVENTURE SEEKER · +100 PTS','Kunjungi 5 titik berbeda di peta.',Math.min(5,S.sc.length)+'/5','#e8a23a',S.adv],['CONSERVATION HERO · +75 PTS','Selesaikan tantangan edukasi konservasi.',S.con?'1/1':'0/1','#d9694f',S.con]];
return`<div class="pts"><span style="opacity:.8">Poin kamu</span><br><big>${S.pts}</big> <b>PTS</b><div class="bar"><i style="width:${Math.min(100,S.pts/7.5)}%"></i></div><small>${nx?`${nx[0]-S.pts} poin lagi untuk ${nx[1]}`:'Semua hadiah terbuka! 🎉'}</small></div>`+M.map(m=>`<div class="card ms ${m[4]?'done':''}" style="--c:${m[3]}"><b>${m[0]}</b><br><span class="mut">${m[1]}</span><br><b>${m[4]?'✅ Selesai':'Progres '+m[2]}</b></div>`).join('')+`<button class="btn o" data-con="1" ${S.con?'disabled':''}>🌿 Kuis Konservasi (+75)</button><button class="btn l" data-reset="1">Reset progres</button><p class="mut" style="font-size:11px">Misi aman: satwa hanya diamati dari area pengunjung. Satu titik hanya dapat diklaim sekali (anti-abuse).</p>`}
function rewards(){return`<div class="pts"><span style="opacity:.8">Reward Center</span><br><big>${S.pts}</big> <b>PTS</b></div>`+RW.map((r,k)=>`<div class="item" style="--c:#f59e0b;cursor:default"><div class="em">${r[2]}</div><div style="flex:1"><b>${r[1]}</b><span>${r[0]} poin</span></div><button class="btn" data-rd="${k}" ${S.pts<r[0]?'disabled':''}>Tukar</button></div>`).join('')+(S.red.length?`<div class="card"><b>Riwayat penukaran</b><br>${S.red.map(x=>`<span class="tag">${x}</span>`).join('')}<p class="mut" style="font-size:11px">Tunjukkan kode ke petugas Reward Center.</p></div>`:'')}
function pane(){const p=$('pane'),sc=p.scrollTop;p.innerHTML=tab=='x'?explore():tab=='q'?quest():tab=='d'?dash():rewards();p.scrollTop=sc;
const rg=$('rg');if(rg)rg.oninput=()=>$('pn').style.transform=`translateX(-${rg.value*3.2}px)`;
const qi=$('q');if(qi)qi.oninput=()=>{q=qi.value.trim().toLowerCase();pane();draw();$('q').focus();const l=$('q').value.length;$('q').setSelectionRange(l,l)}}
function all(){parks();tabs();pane();draw()}
function award(i){const p=PT[D[i][2]];S.sc.push(i);S.pts+=p;let m=`+${p} poin! 🎉`;if(S.sc.length>=5&&!S.adv){S.adv=1;S.pts+=100;m+=' Bonus Adventure Seeker +100!'}sv();toast(m)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-p],[data-t],[data-c],.item[data-i],[data-back],[data-scan],[data-a],[data-con],[data-rd],[data-reset],[data-route],[data-heat],[data-imp],[data-gr]');if(!t)return;const D_=t.dataset;
if(D_.p){park=+D_.p;sel=null;rt=null;cat=null;q='';me=null;all();fit()}
else if(D_.t){tab=D_.t;pane();tabs()}
else if(D_.c!==undefined&&t.classList.contains('chip')){cat=D_.c||null;pane();draw()}
else if(t.classList.contains('item')&&D_.i!==undefined)sel_(+D_.i,1);
else if(D_.back){sel=null;all()}
else if(D_.scan){const i=+D_.scan;$('pane').innerHTML=detail(i,D[i][2]=='sat'?'sat':'edu');const rg=$('rg');if(rg)rg.oninput=()=>$('pn').style.transform=`translateX(-${rg.value*3.2}px)`}
else if(D_.a!==undefined){if(+D_.a===0){const i=+D_.i;if(D_.q=='con'){S.con=1;S.pts+=75;sv();toast('+75 poin! Conservation Hero 🌿');tab='q';all()}else{award(i);all()}}else toast('Belum tepat, coba lagi 🙂')}
else if(D_.con){$('pane').innerHTML=`<button class="btn l" data-t="q">← Kembali</button><div class="card"><b>${Q.con[0]}</b>${Q.con[1].map((o,k)=>`<button class="btn l" style="display:block;width:100%;text-align:left" data-a="${k}" data-q="con" data-i="0">${o}</button>`).join('')}</div>`}
else if(D_.rd){const r=RW[+D_.rd];if(S.pts>=r[0]){S.pts-=r[0];const c='GP-'+Math.random().toString(36).slice(2,6).toUpperCase();S.red.push(r[1]+' · '+c);sv();toast('Kode penukaran: '+c);pane()}}
else if(D_.imp){const n=impG($('imp').value);toast(n?n+' titik diperbarui · titik lain masih skematis':'Tidak ada baris yang cocok. Format: Nama | lat, lon');if(n){rt=null;all();fit()}}else if(D_.gr){Object.keys(G).forEach(k=>delete G[k]);D.forEach((d,i)=>{d[3]=D0[i][0];d[4]=D0[i][1]});saveG();rt=null;all();fit();toast('Koordinat direset ke posisi skematis')}else if(D_.route){const i=+D_.route;rt=i<0?null:[routeStart(i),i];if(i>=0)fly(i);all()}else if(D_.heat){heat=!heat;pane();draw()}else if(D_.reset){S={pts:0,sc:[],adv:0,con:0,red:[]};sv();all()}});
// pan, zoom, klik peta
let dr=null;
svg.addEventListener('pointerdown',e=>{dr={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,mv:0};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect(),dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.hypot(dx,dy)>5)dr.mv=1;if(dr.mv){vb.x=dr.vx-dx/r.width*vb.w;vb.y=dr.vy-dy/r.height*vb.h;ap()}});
svg.addEventListener('pointerup',e=>{if(dr&&!dr.mv){const g=document.elementFromPoint(e.clientX,e.clientY)?.closest('.mk');if(placing){me=pt(e);placing=false;$('loc').classList.remove('on');$('hint').textContent='Lokasi diset · wahana terdekat ditandai';tab='x';all()}else if(g)sel_(+g.dataset.i,0)}dr=null});
svg.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);zoom(e.deltaY>0?1.15:.87,p[0],p[1])},{passive:false});
$('zi').onclick=()=>zoom(.75);$('zo').onclick=()=>zoom(1.33);$('rs').onclick=fit;$('sty').onclick=()=>{sty=(sty+1)%3;$('sty').classList.toggle('on',sty==1);$('hint').textContent=['Gaya: ilustrasi taman','Gaya: citra satelit (simulasi)','Gaya: peta game'][sty];draw()};
$('loc').onclick=()=>{placing=!placing;$('loc').classList.toggle('on',placing);$('hint').textContent=placing?'Ketuk peta untuk menandai posisi Anda':'Geser & zoom peta · ketuk titik untuk detail'};
addEventListener('resize',fit);loadG();all();fit();
</script></body></html>
